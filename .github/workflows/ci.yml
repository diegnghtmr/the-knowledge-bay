name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: knowledge_bay_ci
          POSTGRES_USER: kb_ci
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kb_ci -d knowledge_bay_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install and verify the client
        working-directory: client
        run: |
          npm ci
          npm run lint
          npx playwright install --with-deps chromium
          npm test
          npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/pom.xml
      - name: Verify and package the server against PostgreSQL
        working-directory: server
        env:
          KB_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/knowledge_bay_ci
          KB_TEST_DB_USER: kb_ci
          KB_TEST_DB_PASSWORD: ci-${{ github.run_id }}
        run: ./mvnw -B verify
      - name: Exercise the packaged app with Chromium and PostgreSQL
        env:
          KB_SMOKE_DB_URL: jdbc:postgresql://127.0.0.1:5432/knowledge_bay_ci
          KB_SMOKE_DB_USER: kb_ci
          KB_SMOKE_DB_PASSWORD: ci-${{ github.run_id }}
        run: node client/tests/production-audit.mjs

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the deployable image
        run: docker build --tag knowledge-bay:ci .

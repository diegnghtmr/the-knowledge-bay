name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install and verify the client
        working-directory: client
        run: |
          npm ci
          npm run lint
          npx playwright install --with-deps chromium
          npm test
          npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: server/pom.xml
      - name: Verify and package the server
        working-directory: server
        run: ./mvnw -B verify
      - name: Exercise the packaged app with Chromium and SQLite
        run: node client/tests/production-audit.mjs

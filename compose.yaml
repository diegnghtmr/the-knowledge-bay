services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: knowledge_bay
      POSTGRES_USER: knowledge_bay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to the PostgreSQL password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    image: ${KB_APP_IMAGE:-knowledge-bay:local}
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/knowledge_bay
      SPRING_DATASOURCE_USERNAME: knowledge_bay
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to the PostgreSQL password}
      MODERATOR_PASSWORD: ${MODERATOR_PASSWORD:?Set MODERATOR_PASSWORD to the moderator account password}
      MODERATOR_NAME: ${MODERATOR_NAME:-Administrator}
      MODERATOR_EMAIL: ${MODERATOR_EMAIL:-admin@tkb.com}
      APP_CHAT_MAX_STREAMS_PER_USER: ${APP_CHAT_MAX_STREAMS_PER_USER:-3}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
    ports:
      - "127.0.0.1:${KB_APP_PORT:-8080}:8080"
    volumes:
      - uploads:/var/lib/knowledge-bay/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/interests"]
      start_period: 20s
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
  uploads:

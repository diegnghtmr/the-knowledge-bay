spring.application.name=The Knowledge Bay
server.port=8080
server.servlet.context-path=/
spring.web.resources.static-locations=classpath:/invalid-path/

# Logging
logging.level.co.edu.uniquindio=DEBUG
logging.level.org.springframework.web=INFO

# Database
spring.datasource.url=jdbc:sqlite:mydb.sqlite
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.sql.init.mode=always
spring.sql.init.platform=sqlite

# Resource files: enforce an application limit and bound multipart parsing at the container.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Moderator properties
moderator.name=Administrator
moderator.email=admin@tkb.com
moderator.password=1234